services:

  web:
    build: .
    ports:
      - "8080:80"
    volumes:
      - .:/var/www/html
    depends_on:
      - db
      - mongo
    environment:
      MYSQLHOST: db
      MYSQLDATABASE: vite_et_gourmand
      MYSQLUSER: ${MYSQL_APP_USER}
      MYSQLPASSWORD: ${MYSQL_APP_PASSWORD}
      MYSQLPORT: 3306
      MONGODB_URI: mongodb://mongo:27017
      MONGODB_DATABASE: vite_et_gourmand_stats
      GOOGLE_ROUTES_API_KEY: ${GOOGLE_ROUTES_API_KEY}

  db:
    image: mysql:8.0
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: vite_et_gourmand
      MYSQL_USER: ${MYSQL_APP_USER}
      MYSQL_PASSWORD: ${MYSQL_APP_PASSWORD}
    ports:
      - "3307:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./docker/mysql:/docker-entrypoint-initdb.d:ro

  mongo:
    image: mongo:7.0
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

volumes:
  db_data:
  mongo_data:
